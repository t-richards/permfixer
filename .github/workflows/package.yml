name: Package

on:
  push:
    branches:
      - main

jobs:
  deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: debian:12-slim

    steps:
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git gcc libc6-dev make

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build application
        run: |
          make

      - name: Install NFPM
        run: |
          NFPM_VERSION=$(curl -sL https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | sed 's/v//')
          curl -LO https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb
          dpkg -i nfpm_${NFPM_VERSION}_amd64.deb

      - name: Build Debian package
        run: |
          nfpm pkg --packager deb

      - name: Install GitHub CLI
        run: |
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install -y gh

      - name: Create release with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory /__w/permfixer/permfixer
          gh release delete latest --cleanup-tag || true
          gh release create latest permfixer_*.deb --latest
